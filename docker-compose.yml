services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: radioflow-backend
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      DATASET_PATH: "/data"
      FALLBACK_FEATURES_CSV_PATH: "/fallback/features.csv"
    volumes:
      - ./backend/app:/app/app
      - ./backend/ml:/app/ml
      - ${DATASET_PATH}:/data:ro
      - ${FALLBACK_FEATURES_CSV_PATH}:/fallback/features.csv:ro
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  backend_data: